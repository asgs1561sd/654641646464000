            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
        }
        
        .filter-buttons { 
            display: flex; 
            gap: 0.6rem; 
        }
        
        .filter-btn { 
            background: #f5f5f5; 
            border: 1px solid #e0e0e0; 
            padding: 0.5rem 1.2rem; 
            border-radius: 40px; 
            font-size: 0.8rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            color: #555; 
        }
        
        .filter-btn:hover { 
            background: #e8e8e8; 
            transform: translateY(-1px);
        }
        
        .filter-btn.active { 
            background: #111;
            color: white; 
            border-color: #111;
        }
        
        .search-wrapper { 
            background: #fafafa; 
            border-radius: 40px; 
            border: 1px solid #e0e0e0; 
            padding: 0.4rem 1rem; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            width: 260px; 
            transition: all 0.2s;
        }
        
        .search-wrapper:focus-within { 
            border-color: #111; 
            box-shadow: 0 0 0 2px rgba(0,0,0,0.05);
        }
        
        .search-wrapper input { 
            border: none; 
            outline: none; 
            background: transparent; 
            width: 100%; 
            font-size: 0.8rem;
            color: #1a1a1a;
        }
        
        .search-wrapper input::placeholder {
            color: #aaa;
        }
        
        .progress-indicator { 
            background: #111;
            padding: 0.4rem 1rem; 
            border-radius: 40px; 
            font-size: 0.75rem; 
            font-weight: 600; 
            color: white;
        }
        
        .cards-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); 
            gap: 1.5rem; 
        }
        
        .flip-card {
            background: transparent;
            perspective: 1500px;
            cursor: pointer;
        }
        
        .flip-card-inner {
            position: relative;
            width: 100%;
            min-height: 420px;
            text-align: center;
            transition: transform 0.5s ease-in-out;
            transform-style: preserve-3d;
        }
        
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        
        .card-front, .card-back {
            position: relative;
            width: 100%;
            min-height: 420px;
            backface-visibility: hidden;
            border-radius: 24px;
            background: white;
            padding: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid #e8e8e8;
            display: flex;
            flex-direction: column;
        }
        
        .card-front {
            transform: rotateY(0deg);
            justify-content: center;
        }
        
        .card-back {
            transform: rotateY(180deg);
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            overflow-y: auto;
        }
        
        .card-word-large {
            font-size: 2rem;
            font-weight: 800;
            color: #111;
            margin-bottom: 0.5rem;
        }
        
        .card-translation {
            font-size: 1rem;
            color: #666;
            margin-bottom: 1rem;
        }
        
        .flip-hint {
            margin-top: 1rem;
            font-size: 0.7rem;
            color: #aaa;
        }
        
        .sentence-block {
            margin-bottom: 1.2rem;
            flex: 1;
        }
        
        .example-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .sentence-counter {
            font-size: 0.7rem;
            background: #f0f0f0;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            color: #555;
            font-weight: 600;
            border: 1px solid #e0e0e0;
        }
        
        .example-text {
            background: #fafafa;
            padding: 0.8rem;
            border-radius: 14px;
            direction: ltr;
            text-align: left;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            border-right: 3px solid #111;
            font-family: monospace;
            color: #1a1a1a;
            word-break: break-word;
        }
        
        .example-translation {
            background: #f5f5f5;
            padding: 0.6rem 0.8rem;
            border-radius: 12px;
            direction: rtl;
            text-align: right;
            font-size: 0.8rem;
            color: #555;
            margin-bottom: 12px;
            border-right: 2px solid #aaa;
            font-weight: 500;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .listen-button, .next-sentence-btn {
            border: none;
            padding: 0.6rem 1.3rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .listen-button i, .next-sentence-btn i {
            font-size: 0.9rem;
        }

            background: #f0f0f0;
            color: #444;
            border: 1px solid #ddd;
        }
        
        .listen-button:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        .next-sentence-btn {
            background: #111;
            color: white;
        }
        
        .next-sentence-btn:hover {
            background: #333;
            transform: translateY(-2px);
        }

            border: 2px solid #e0e0e0;
            font-family: monospace;
            font-size: 0.9rem;
            direction: ltr;
            text-align: left;
            transition: all 0.2s;
            background: white;
            color: #1a1a1a;

        }

        }

            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .check-btn, .retry-btn {

            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;

            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        }

            background: #111;
            color: white;
        }

            background: #333;
            transform: translateY(-2px);
        }
        
        .retry-btn {
            background: #f0f0f0;
            color: #555;
            border: 1px solid #ddd;
        }
        
        .retry-btn:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

            background: #f5e8e8;
            color: #a55a5a;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

            background: #f5f5f5;
            color: #888;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }

            border-color: #ccc;

            top: 10px;
            right: 10px;

            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;

            justify-content: space-between;

            align-items: center;

            font-size: 0.65rem;
            color: #aaa;
            margin-top: 1rem;
        }
        
        @media (max-width: 1000px) {

            .cards-grid { 
                grid-template-columns: 1fr; 
            }
            .controls-bar { 
                flex-direction: column; 
                align-items: stretch; 
            }
            .search-wrapper { 
                width: 100%; 
            }
            .card-word-large { 
                font-size: 1.5rem; 
            }
            .card-front, .card-back {
                min-height: 400px;
            }
            .flip-card-inner {
                min-height: 400px;
            }
            .main-container {
                padding: 0 1rem;
                margin: 1rem auto;
            }
            .listen-button, .next-sentence-btn, .check-btn, .retry-btn {
                padding: 0.5rem 1rem;
                font-size: 0.75rem;
            }
        }
        
        @media (max-width: 480px) {
            .card-word-large { 
                font-size: 1.3rem; 
            }
            .example-text {
                font-size: 0.75rem;
            }
            .button-group {
                width: 100%;
                justify-content: space-between;
            }
            .listen-button, .next-sentence-btn {
                flex: 1;
                justify-content: center;
            }
            .action-buttons {
                width: 100%;
                justify-content: space-between;
            }
            .check-btn, .retry-btn {
                flex: 1;
                justify-content: center;
            }
        }
        
        .shake-input {
            animation: shake 0.12s ease-in-out 0s 2;
            border-color: #a55a5a !important;
            background: #fef5f5 !important;
        }
        
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
            100% { transform: translateX(0); }
        }
        
        i { pointer-events: none; }
        button { font-family: inherit; }
        
        .flip-icon {
            position: absolute;
            bottom: 12px;
            left: 12px;
            font-size: 0.7rem;
            color: #bbb;
        }
        
        .card-back::-webkit-scrollbar {
            width: 4px;
        }
        
        .card-back::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 4px;
        }
        
        .card-back::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
    </style>
</head>

        { word: "Command", translation: "التمكن (Good command of English)", level: "general" },
        { word: "Tech-savvy", translation: "بارع في التكنولوجيا والبرامج", level: "professional" },
        { word: "Bilingual", translation: "متحدث بلغتين", level: "general" },
        { word: "Skillset", translation: "مجموعة المهارات", level: "general" },
        { word: "Proficiency", translation: "كفاءة / براعة", level: "general" },
        
        // التسويق والمحتوى الرقمي
        { word: "Content", translation: "محتوى", level: "professional" },
        { word: "SEO", translation: "تهيئة محركات البحث", level: "professional" },
        { word: "Marketing", translation: "التسويق", level: "professional" },
        { word: "Engagement", translation: "التفاعل والمشاركة", level: "professional" },
        { word: "Platform", translation: "منصة إلكترونية", level: "professional" },
        { word: "Audience", translation: "الجمهور / المتابعين", level: "professional" },
        { word: "Trends", translation: "الاتجاهات السائدة / التريند", level: "professional" },
        { word: "Traffic", translation: "الزيارات المهتمة بالمحتوى", level: "professional" },
        { word: "Update", translation: "يواكب / يحدّث", level: "general" },
        
        // التطوير المهني والطموح
        { word: "Aspire to", translation: "يطمح إلى", level: "general" },
        { word: "Accreditation", translation: "اعتماد دولي أو رسمي", level: "professional" },
        { word: "Professional", translation: "محترف", level: "professional" },
        { word: "Challenge", translation: "تحدي", level: "general" },
        { word: "Growth", translation: "نمو / تطور مهني", level: "professional" },
        { word: "Long-term", translation: "طويل المدى", level: "general" },
        { word: "Short-term", translation: "قصير المدى", level: "general" },
        { word: "Aspiration", translation: "تطلع / طموح مستقبلي", level: "general" }
    ];
    
    // دالة لبناء الجمل مع ترجمتها العربية لكل كلمة
    function buildSentenceSetWithTranslation(wordObj) {
        const w = wordObj.word;
        
        // جمل مخصصة لبعض الكلمات المهمة
        const customSets = {
            "Introduce": {
                en: ["Let me introduce myself.", "I would like to introduce my background.", "Allow me to introduce my skills.", "I introduce new ideas to the team.", "Let me introduce my colleague."],
                ar: ["دعني أعرف بنفسي.", "أود أن أعرف بخلفيتي.", "اسمح لي أن أعرف بمهاراتي.", "أقدم أفكار جديدة للفريق.", "دعني أعرف بزميلي."]
            },
            "Opportunity": {
                en: ["This is a great opportunity.", "I seize every learning opportunity.", "Opportunity comes with preparation.", "I appreciate this career opportunity.", "Every challenge is an opportunity."],
                ar: ["هذه فرصة رائعة.", "أغتنم كل فرصة للتعلم.", "الفرصة تأتي مع الاستعداد.", "أقدر فرصة العمل هذه.", "كل تحدٍ هو فرصة."]
            },
            "Value": {
                en: ["I add value to my workplace.", "Value is what I focus on.", "Creating value for customers.", "My work brings value to the team.", "Value drives my decisions."],
                ar: ["أضيف قيمة لمكان عملي.", "القيمة هي ما أركز عليه.", "خلق قيمة للعملاء.", "عملي يجلب قيمة للفريق.", "القيمة تقود قراراتي."]
            },
            "Experience": {
                en: ["I have years of experience.", "My experience includes project management.", "Experience taught me many lessons.", "I gained experience from every role.", "Experience is my best teacher."],
                ar: ["لدي سنوات من الخبرة.", "خبرتي تشمل إدارة المشاريع.", "الخبرة علمتني دروساً كثيرة.", "اكتسبت خبرة من كل دور.", "الخبرة هي أفضل معلم لي."]
            }
        };
        
        if (customSets[w]) {
            return { en: [...customSets[w].en], ar: [...customSets[w].ar] };
        }
        
        // جمل عامة لكل كلمة
        const baseEn = [
            `My ${w} is very important to me.`,
            `I take my ${w} seriously every day.`,
            `${w} defines who I am as a person.`,
            `I always work on improving my ${w}.`,
            `My ${w} helps me achieve success.`
        ];
        
        const baseAr = [
            `${w} مهم جداً بالنسبة لي.`,
            `آخذ ${w} الخاص بي على محمل الجد كل يوم.`,
            `${w} يحدد من أنا كشخص.`,
            `أعمل دائماً على تحسين ${w} الخاص بي.`,
            `${w} الخاص بي يساعدني على تحقيق النجاح.`
        ];
        
        return { en: baseEn, ar: baseAr };
    }
    
    // إنشاء قاعدة البيانات الكاملة
    let allItems = [];
    allWordsList.forEach((item, idx) => {
        const sentences = buildSentenceSetWithTranslation(item);
        allItems.push({
            id: idx,
            word: item.word,
            translation: item.translation,
            level: item.level,
            sentencesEn: sentences.en,
            sentencesAr: sentences.ar
        });
    });
    
    let completedPerWord = Array(allItems.length).fill().map(() => Array(5).fill(false));
    let currentSentenceIndex = Array(allItems.length).fill(0);
    let userAnswers = Array(allItems.length).fill().map(() => Array(5).fill(""));
    let currentFilter = "all";
    let searchWord = "";
    
    function updateStats() {
        let totalCompleted = 0;
        for (let i = 0; i < allItems.length; i++) {
            for (let j = 0; j < 5; j++) {
                if (completedPerWord[i][j]) totalCompleted++;
            }
        }
        document.getElementById("progressText").innerHTML = `تم الإتقان: ${totalCompleted} / ${allItems.length * 5} جملة`;
        localStorage.setItem("self100_completed_sentences", JSON.stringify(completedPerWord));
        localStorage.setItem("self100_current_sentence_idx", JSON.stringify(currentSentenceIndex));
        localStorage.setItem("self100_answers_matrix", JSON.stringify(userAnswers));
    }
    
    function speakSentence(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
    }
    
    function verifyInput(wordId, sentencePos, inputField, feedbackSpan, cardElement) {
        let target = allItems[wordId].sentencesEn[sentencePos].trim();
        let userVal = inputField.value.trim();
        let normalize = s => s.toLowerCase().replace(/\s+/g, ' ').replace(/[^\w\s]/g, '').trim();
        
        if (normalize(userVal) === normalize(target) && userVal.length > 0) {
            if (!completedPerWord[wordId][sentencePos]) {
                completedPerWord[wordId][sentencePos] = true;
                feedbackSpan.innerHTML = `<span class="correct-msg"><i class="fas fa-check-circle"></i> إجابة صحيحة - تم إتقان الجملة</span>`;
                updateStats();
                let allSentencesCompleted = completedPerWord[wordId].every(v => v === true);
                if (allSentencesCompleted) {
                    cardElement.classList.add("completed");
                    feedbackSpan.innerHTML = `<span class="correct-msg"><i class="fas fa-trophy"></i> تم إتقان جميع جمل هذه الكلمة</span>`;
                }
            } else {
                feedbackSpan.innerHTML = `<span class="correct-msg"><i class="fas fa-star"></i> سبق إتقان هذه الجملة</span>`;
            }
        } else {
            feedbackSpan.innerHTML = `<span class="wrong-msg"><i class="fas fa-times-circle"></i> غير مطابق، استمع للجملة وحاول مرة أخرى</span>`;
            inputField.classList.add("shake-input");
            setTimeout(() => inputField.classList.remove("shake-input"), 250);
        }
        userAnswers[wordId][sentencePos] = userVal;
        localStorage.setItem("self100_answers_matrix", JSON.stringify(userAnswers));
    }
    
    function nextSentence(wordId, inputField, feedbackSpan, sentenceDisplaySpan, sentenceTranslationSpan, sentenceCounterSpan) {
        let current = currentSentenceIndex[wordId];
        let nextIdx = (current + 1) % 5;
        currentSentenceIndex[wordId] = nextIdx;
        localStorage.setItem("self100_current_sentence_idx", JSON.stringify(currentSentenceIndex));
        
        let newSentenceEn = allItems[wordId].sentencesEn[nextIdx];
        let newSentenceAr = allItems[wordId].sentencesAr[nextIdx];
        sentenceDisplaySpan.textContent = newSentenceEn;
        sentenceTranslationSpan.textContent = newSentenceAr;
        sentenceCounterSpan.innerHTML = `الجملة ${nextIdx+1} / 5`;
        
        inputField.value = "";
        inputField.style.background = "white";
        feedbackSpan.innerHTML = `<span class="neutral-msg"><i class="fas fa-arrow-left"></i> جملة جديدة - اكتبها ثم تحقق</span>`;
        
        let cardElement = inputField.closest(".word-card");
        let allComp = completedPerWord[wordId].every(v => v === true);
        if (!allComp) cardElement.classList.remove("completed");
    }
    
    function resetSingleWord(wordId) {
        for (let j = 0; j < 5; j++) {
            completedPerWord[wordId][j] = false;
            userAnswers[wordId][j] = "";
        }
        currentSentenceIndex[wordId] = 0;
        updateStats();
        renderCards();
    }
    
    function renderCards() {
        let filtered = [...allItems];
        if (searchWord.trim() !== "") {
            let term = searchWord.toLowerCase();
            filtered = filtered.filter(item => item.word.toLowerCase().includes(term) || item.translation.includes(term));
        }
        
        let grid = document.getElementById("cardsGrid");
        grid.innerHTML = "";
        
        for (let item of filtered) {
            let idx = item.id;
            let sentencePos = currentSentenceIndex[idx];
            let currentSentenceEn = item.sentencesEn[sentencePos];
            let currentSentenceAr = item.sentencesAr[sentencePos];
            let allCompleted = completedPerWord[idx].every(v => v === true);
            let savedVal = userAnswers[idx][sentencePos] || "";
            let isCurrentCompleted = completedPerWord[idx][sentencePos];
            
            let cardDiv = document.createElement("div");
            cardDiv.className = `flip-card word-card ${allCompleted ? 'completed' : ''}`;
            cardDiv.setAttribute("data-id", idx);
            
            cardDiv.innerHTML = `
                <div class="flip-card-inner">
                    <div class="card-front">
                        ${allCompleted ? '<div class="completion-badge"><i class="fas fa-check-circle"></i> مكتملة</div>' : ''}
                        <div class="card-word-large">${escapeHtml(item.word)}</div>
                        <div class="card-translation">${escapeHtml(item.translation)}</div>
                        <div class="flip-hint">
                            <i class="fas fa-hand-pointer"></i> اضغط لقلب البطاقة
                        </div>
                        <div class="flip-icon">
                            <i class="fas fa-sync-alt"></i>
                        </div>
                    </div>
                    <div class="card-back">
                        ${allCompleted ? '<div class="completion-badge"><i class="fas fa-check-circle"></i> مكتملة</div>' : ''}
                        <div class="sentence-block">
                            <div class="example-header">
                                <span class="sentence-counter" id="counter-${idx}">الجملة ${sentencePos+1} / 5</span>
                                <div class="button-group">
                                    <button class="next-sentence-btn" id="next-${idx}"><i class="fas fa-exchange-alt"></i> جملة أخرى</button>
                                    <button class="listen-button" id="listen-${idx}"><i class="fas fa-volume-up"></i> استمع</button>
                                </div>
                            </div>
                            <div class="example-text" id="sentence-display-${idx}">${escapeHtml(currentSentenceEn)}</div>
                            <div class="example-translation" id="sentence-translation-${idx}">
                                <i class="fas fa-language"></i> ${escapeHtml(currentSentenceAr)}
                            </div>
                        </div>
                        <div class="practice-block">
                            <input type="text" class="practice-input" id="input-${idx}" placeholder="اكتب الجملة الإنجليزية..." value="${escapeHtml(savedVal)}" style="background:${isCurrentCompleted ? '#e8f5e8' : 'white'}">
                            <div class="feedback-row">
                                <span id="fb-${idx}">${isCurrentCompleted ? '<span class="correct-msg"><i class="fas fa-check-circle"></i> مكتملة</span>' : '<span class="neutral-msg"><i class="fas fa-edit"></i> اكتب الجملة ثم تحقق</span>'}</span>
                                <div class="action-buttons">
                                    <button class="check-btn" id="check-${idx}"><i class="fas fa-check"></i> تحقق</button>
                                    <button class="retry-btn" id="retry-word-${idx}"><i class="fas fa-redo-alt"></i> إعادة</button>
                                </div>
                            </div>
                        </div>
                        <div class="flip-icon" style="position: static; margin-top: 10px;">
                            <i class="fas fa-undo-alt"></i> اضغط لقلب البطاقة
                        </div>
                    </div>
                </div>
            `;
            
            grid.appendChild(cardDiv);
            
            const flipCard = cardDiv;
            flipCard.addEventListener("click", (e) => {
                if (e.target.closest('button') || e.target.closest('input')) return;
                flipCard.classList.toggle("flipped");
            });
            
            let inputEl = document.getElementById(`input-${idx}`);
            let fbSpan = document.getElementById(`fb-${idx}`);
            let checkBtn = document.getElementById(`check-${idx}`);
            let retryWordBtn = document.getElementById(`retry-word-${idx}`);
            let nextBtn = document.getElementById(`next-${idx}`);
            let listenBtn = document.getElementById(`listen-${idx}`);
            let sentenceDisplaySpan = document.getElementById(`sentence-display-${idx}`);
            let sentenceTranslationSpan = document.getElementById(`sentence-translation-${idx}`);
            let counterSpan = document.getElementById(`counter-${idx}`);
            
            if (listenBtn) {
                listenBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    speakSentence(currentSentenceEn);
                });
            }
            if (checkBtn) {
                checkBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    verifyInput(idx, sentencePos, inputEl, fbSpan, cardDiv);
                });
            }
            if (retryWordBtn) {
                retryWordBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    resetSingleWord(idx);
                });
            }
            if (nextBtn) {
                nextBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    nextSentence(idx, inputEl, fbSpan, sentenceDisplaySpan, sentenceTranslationSpan, counterSpan);
                    let newSentenceText = sentenceDisplaySpan.textContent;
                    let newListenBtn = document.getElementById(`listen-${idx}`);
                    if (newListenBtn) {
                        newListenBtn.replaceWith(newListenBtn.cloneNode(true));
                        let freshListenBtn = document.getElementById(`listen-${idx}`);
                        if (freshListenBtn) {
                            freshListenBtn.addEventListener("click", (e) => {
                                e.stopPropagation();
                                speakSentence(newSentenceText);
                            });
                        }
                    }
                });
            }
        }
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }
    
    function loadSaved() {
        let savedComp = localStorage.getItem("self100_completed_sentences");
        if (savedComp) { try { let p = JSON.parse(savedComp); if (p.length === allItems.length) completedPerWord = p; } catch(e){} }
        let savedIdx = localStorage.getItem("self100_current_sentence_idx");
        if (savedIdx) { try { let idxs = JSON.parse(savedIdx); if (idxs.length === allItems.length) currentSentenceIndex = idxs; } catch(e){} }
        let savedAns = localStorage.getItem("self100_answers_matrix");
        if (savedAns) { try { let a = JSON.parse(savedAns); if (a.length === allItems.length) userAnswers = a; } catch(e){} }
        updateStats();
    }
    
    function fullReset() {
        if (confirm("هل أنت متأكد؟ سيتم حذف كل التمارين الصحيحة وإعادة ضبط جميع الجمل.")) {
            completedPerWord = Array(allItems.length).fill().map(() => Array(5).fill(false));
            currentSentenceIndex = Array(allItems.length).fill(0);
            userAnswers = Array(allItems.length).fill().map(() => Array(5).fill(""));
            updateStats();
            renderCards();
        }
    }
    
    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderCards();
        });
    });
    document.getElementById("searchInput").addEventListener("input", (e) => {
        searchWord = e.target.value;
        renderCards();
    });
    document.getElementById("resetAllBtn").addEventListener("click", fullReset);
    document.getElementById("backArrowBtn").addEventListener("click", () => { window.location.href = "index.html"; });
    
    loadSaved();
    renderCards();
</script>
</body>
</html>
